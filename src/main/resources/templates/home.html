<!DOCTYPE html>
<!--/*
============================================================
[home.html] 홈 화면 (팀장: 화면 / D: AI 맛집 추천)
============================================================
컨트롤러: HomeController.home()  (GET /)
  model.addAttribute("restaurants", restaurantService.findLatest6())
  → restaurants : List<RestaurantResponse> 최신 맛집 6개
  loginMember   : GlobalModelAdvice 가 넣는 로그인 회원 (없으면 null)
AI 추천: 아래 추천 폼 → fetch POST /api/ai/recommend → AiApiController.recommend()
============================================================
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/* th:replace : 이 태그를 fragments/layout.html 의 head 조각으로 바꾼다. '홈' 이 title 매개변수로 들어간다. */-->
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>

<main class="container mb-5">

    <div class="bg-primary text-white rounded-3 p-4 p-md-5 mb-4 text-center">
        <h1 class="display-5 fw-bold"><i class="bi bi-shop"></i>부산 한끼</h1>
        <p class="lead mb-4">부산의 숨은 맛집을 발견하고, 리뷰를 공유하세요!</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a th:href="@{/restaurants}" class="btn btn-light btn-lg"><i class="bi bi-search"></i> 맛집 둘러보기</a>
            <!--/* 로그인 안 했으면 회원가입, 했으면 맛집 등록 버튼 */-->
            <a th:unless="${loginMember != null}" th:href="@{/members/signup}" class="btn btn-outline-light btn-lg"><i class="bi bi-person-plus"></i> 회원가입</a>
            <a th:if="${loginMember != null}" th:href="@{/restaurants/new}" class="btn btn-outline-light btn-lg"><i class="bi bi-plus-circle"></i> 맛집 등록</a>
        </div>
    </div>

    <!-- AI 맛집 추천 (D 담당) -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <h4 class="card-title"><i class="bi bi-robot"></i> AI 맛집 추천</h4>
            <p class="text-muted small mb-3">먹고 싶은 것을 자유롭게 적어 보세요. 등록된 맛집 안에서만 골라 드립니다. (무료 AI 모델 · 1인 하루 5회)</p>
            <!--/* 로그인한 회원에게만 입력창을 보여 준다 */-->
            <div th:if="${loginMember != null}">
                <form id="aiForm" class="d-flex gap-2">
                    <input type="text" id="aiQuestion" class="form-control" maxlength="300"
                           placeholder="예) 비 오는 날 따뜻한 국물, 조용한 카페에서 공부" required>
                    <button type="submit" id="aiBtn" class="btn btn-primary text-nowrap"><i class="bi bi-stars"></i> 추천받기</button>
                </form>
                <div id="aiMsg" class="small mt-2 text-muted"></div>
                <div class="row g-4 mt-1" id="aiResult"></div>
            </div>
            <div th:unless="${loginMember != null}" class="alert alert-secondary mb-0">
                <a th:href="@{/members/login}">로그인</a> 하면 AI 추천을 사용할 수 있습니다.
            </div>
        </div>
    </div>
    <h2 class="mb-3"><i class="bi bi-fire"></i> 최근 등록된 맛집</h2>
    <div class="row g-4">
        <!--/* th:each="restaurant : ${restaurants}" : HomeController 가 넣은 List<RestaurantResponse> 반복 */-->
        <div class="col-md-6 col-lg-4" th:each="restaurant : ${restaurants}">
            <div class="card h-100">
                <!--/* th:if="${restaurant.imageUrl}" : 문자열이 null 이거나 비면 거짓 → img 태그를 만들지 않음
                       th:src : src 속성 값을 RestaurantResponse.getImageUrl() 로 채운다 */-->
                <img th:if="${restaurant.imageUrl}" th:src="${restaurant.imageUrl}" th:alt="${restaurant.name}"
                     class="card-img-top" style="height:180px;object-fit:cover;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0">
                            <!--/* @{/restaurants/{id}(id=${restaurant.id})} : 주소 안 {id} 자리에 값을 넣는다 → /restaurants/3 */-->
                            <a th:href="@{/restaurants/{id}(id=${restaurant.id})}" class="text-decoration-none text-dark"
                               th:text="${restaurant.name}">맛집 이름</a>
                        </h5>
                        <span class="badge bg-primary" th:text="${restaurant.categoryDisplayName}">한식</span>
                    </div>
                    <p class="card-text text-muted small mb-2"><i class="bi bi-geo-alt"></i> <span th:text="${restaurant.address}">주소</span></p>
                    <p class="card-text small" th:if="${restaurant.description}" th:text="${restaurant.description}">설명</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="rating-stars">
                            <!--/* #numbers.sequence(1,5) : 1,2,3,4,5 목록을 만드는 타임리프 유틸리티.
                                   th:classappend : 기존 class 에 이 값을 덧붙인다. 평균 별점 이하이면 꽉 찬 별 */-->
                            <i class="bi" th:each="star : ${#numbers.sequence(1,5)}"
                               th:classappend="${star <= restaurant.averageRating} ? 'bi-star-fill' : 'bi-star'"></i>
                            <span class="text-muted small ms-1" th:text="'(' + ${restaurant.averageRating} + ')'">(0.0)</span>
                        </div>
                        <small class="text-muted" th:text="'by ' + ${restaurant.memberNickname}">by 닉네임</small>
                    </div>
                </div>
            </div>
        </div>
        <!--/* #lists.isEmpty : 목록이 비었는지 검사하는 유틸리티 */-->
        <div class="col-12" th:if="${#lists.isEmpty(restaurants)}">
            <div class="alert alert-info text-center"><i class="bi bi-info-circle"></i> 아직 등록된 맛집이 없습니다. 첫 번째 맛집을 등록해보세요!</div>
        </div>

    <!-- 카테고리 바로가기 (3 x 3) -->
    <!--/* d-flex + align-items-baseline: 제목과 링크를 한 줄에 놓고 글자 아랫선을 맞춤 */-->
    <div class="d-flex align-items-baseline gap-2 mb-3">
        <h2 class="mb-0"><i class="bi bi-grid-3x3-gap-fill"></i> 카테고리별 맛집</h2>
        <a th:href="@{/restaurants}" class="small text-muted text-decoration-none">전체 맛집 보기 <i class="bi bi-chevron-right"></i></a>
    </div>
    <div class="row row-cols-3 row-cols-lg-9 g-2 mb-5">
        <!--/* @{/restaurants(category='KOREAN')} : 괄호 안은 쿼리 파라미터 → /restaurants?category=KOREAN
               이미지: static/images/category/{카테고리 이름 소문자}.svg */-->
        <div class="col">
            <a th:href="@{/restaurants(category='KOREAN')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/korean.svg}" alt="한식" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='CHINESE')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/chinese.svg}" alt="중식" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='JAPANESE')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/japanese.svg}" alt="일식" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='WESTERN')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/western.svg}" alt="양식" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='CAFE')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/cafe.svg}" alt="카페" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='SEAFOOD')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/seafood.svg}" alt="해산물·회" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='MEAT')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/meat.svg}" alt="고기·구이" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='SOUP')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/soup.svg}" alt="국밥·탕" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
        <div class="col">
            <a th:href="@{/restaurants(category='ETC')}" class="text-decoration-none">
                <div class="card p-0 overflow-hidden h-100">
                    <img th:src="@{/images/category/etc.svg}" alt="기타" class="w-100 d-block" style="aspect-ratio:1/1;object-fit:cover;">                </div>
            </a>
        </div>
    </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>

<script>
    /* AI 맛집 추천 (D 담당)
       요청: POST /api/ai/recommend  본문 {"question": "..."}
       응답: { picks: [ { restaurant: {...RestaurantResponse}, reason: "..." } ], remaining: 4 }
       AI 가 쓴 글(reason)과 맛집 정보는 모두 esc() 로 이스케이프해서 넣는다. */
    const aiForm = document.getElementById('aiForm');
    if (aiForm) {
        aiForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const question = document.getElementById('aiQuestion').value.trim();
            const msg = document.getElementById('aiMsg');
            const result = document.getElementById('aiResult');
            const btn = document.getElementById('aiBtn');
            if (!question) return;
            btn.disabled = true;
            msg.className = 'small mt-2 text-muted';
            msg.textContent = 'AI 가 맛집을 고르는 중입니다... (무료 모델이라 10초 이상 걸릴 수 있습니다)';
            result.innerHTML = '';
            fetchJson('/api/ai/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            }).then(function (r) {
                btn.disabled = false;
                if (!r.ok) {
                    msg.className = 'small mt-2 text-danger';
                    msg.textContent = r.body.error || '추천에 실패했습니다.';
                    return;
                }
                if (!r.body.picks || r.body.picks.length === 0) {
                    msg.className = 'small mt-2 text-warning';
                    msg.textContent = '조건에 맞는 맛집을 찾지 못했습니다. 다르게 적어 보세요. (오늘 남은 횟수: ' + r.body.remaining + ')';
                    return;
                }
                msg.textContent = '오늘 남은 AI 사용 횟수: ' + r.body.remaining + '회';
                result.innerHTML = r.body.picks.map(function (p) {
                    return restaurantCardHtml(p.restaurant,
                        '<div class="alert alert-light border mt-3 mb-0 small"><i class="bi bi-robot"></i> ' + esc(p.reason) + '</div>');
                }).join('');
            }).catch(function () {
                btn.disabled = false;
                msg.className = 'small mt-2 text-danger';
                msg.textContent = '서버 오류가 발생했습니다.';
            });
        });
    }
</script>
</body>
</html>
