<!DOCTYPE html>
<!--/*
============================================================
[mypage/dashboard.html] 마이페이지 (A 회원·인증 담당)
============================================================
컨트롤러: MyPageViewController.dashboard()  (GET /mypage) → 넘겨주는 값 없음
  loginMember : GlobalModelAdvice 가 넣는 로그인 회원 (닉네임·이메일·역할 표시에 사용)
API (MyPageApiController)
  GET /api/mypage/stats                 → { restaurantCount, reviewCount, wishlistCount }
  GET /api/mypage/restaurants?page=0    → { content:[...], totalPages, currentPage }
  GET /api/mypage/reviews?page=0        → { content:[...], totalPages, currentPage }
  PUT /api/mypage/nickname, /password   → { message } 또는 { error }
============================================================
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마이페이지')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container mb-5">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <div class="me-4"><i class="bi bi-person-circle" style="font-size:4rem;color:#0d6efd;"></i></div>
                <div>
                    <h3 class="mb-1" id="profileNickname" th:text="${loginMember.nickname} + '님'">닉네임님</h3>
                    <p class="text-muted mb-1"><i class="bi bi-envelope"></i> <span th:text="${loginMember.email}">email</span></p>
                    <!--/* loginMember.role.displayName → Role.getDisplayName() → "일반 사용자" / "관리자" */-->
                    <p class="text-muted mb-0"><i class="bi bi-shield-check"></i> <span class="badge bg-primary" th:text="${loginMember.role.displayName}">일반 사용자</span></p>
                </div>
            </div>
            <div class="row mt-4 g-2">
                <div class="col-4"><div class="card text-center bg-light"><div class="card-body py-3">
                    <h5 class="card-title text-primary mb-0" id="statRestaurants">-</h5><small class="text-muted">등록한 맛집</small></div></div></div>
                <div class="col-4"><div class="card text-center bg-light"><div class="card-body py-3">
                    <h5 class="card-title text-success mb-0" id="statReviews">-</h5><small class="text-muted">작성한 리뷰</small></div></div></div>
                <div class="col-4"><div class="card text-center bg-light"><div class="card-body py-3">
                    <h5 class="card-title text-danger mb-0" id="statWishlists">-</h5><small class="text-muted">찜한 맛집</small></div></div></div>
            </div>
        </div>
    </div>

    <ul class="nav nav-tabs mb-4" role="tablist">

        <!-- 일반 회원(USER)에게는 내 맛집 숨김 -->
        <li class="nav-item" role="presentation"
            th:if="${loginMember.role.name() != 'USER'}">
            <button class="nav-link active"
                    id="restaurants-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#restaurants-pane"
                    type="button" role="tab">
                <i class="bi bi-shop"></i> 내 맛집
            </button>
        </li>

        <!-- 내 리뷰 -->
        <li class="nav-item" role="presentation">
            <button class="nav-link"
                    th:classappend="${loginMember.role.name() == 'USER'} ? ' active' : ''"
                    id="reviews-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#reviews-pane"
                    type="button" role="tab">
                <i class="bi bi-chat-dots"></i> 내 리뷰
            </button>
        </li>

        <!-- 찜 목록 -->
        <li class="nav-item" role="presentation">
            <button class="nav-link"
                    id="wishlists-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#wishlists-pane"
                    type="button" role="tab">
                <i class="bi bi-heart"></i> 찜 목록
            </button>
        </li>

        <!-- 프로필 수정 -->
        <li class="nav-item" role="presentation">
            <button class="nav-link"
                    id="profile-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#profile-pane"
                    type="button" role="tab">
                <i class="bi bi-gear"></i> 프로필 수정
            </button>
        </li>

    </ul>

    <div class="tab-content">

        <!-- 내 맛집: USER에게 숨김 -->
        <div class="tab-pane fade show active"
             id="restaurants-pane"
             role="tabpanel"
             th:if="${loginMember.role.name() != 'USER'}">

            <div class="row" id="myRestaurantsList"></div>
            <nav id="restaurantsPagination" class="mt-3">
                <ul class="pagination justify-content-center"></ul>
            </nav>
        </div>

        <!-- 내 리뷰: USER의 기본 활성 탭 -->
        <div class="tab-pane fade"
             th:classappend="${loginMember.role.name() == 'USER'} ? ' show active' : ''"
             id="reviews-pane"
             role="tabpanel">

            <div id="myReviewsList"></div>
            <nav id="reviewsPagination" class="mt-3">
                <ul class="pagination justify-content-center"></ul>
            </nav>
        </div>

        <!-- 찜 목록 -->
        <div class="tab-pane fade"
             id="wishlists-pane"
             role="tabpanel">

            <div class="row" id="myWishlistsList"></div>
        </div>
        <div class="tab-pane fade" id="profile-pane" role="tabpanel">
            <div class="row justify-content-center"><div class="col-md-6">
                <div class="card shadow-sm mb-4"><div class="card-body">
                    <h5 class="card-title mb-3"><i class="bi bi-person"></i> 닉네임 변경</h5>
                    <div id="nicknameMsg" class="alert d-none"></div>
                    <form id="nicknameForm">
                        <div class="mb-3"><label for="newNickname" class="form-label">새 닉네임</label>
                            <input type="text" class="form-control" id="newNickname" minlength="2" maxlength="10" required></div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> 닉네임 변경</button>
                    </form>
                </div></div>
                <div class="card shadow-sm"><div class="card-body">
                    <h5 class="card-title mb-3"><i class="bi bi-lock"></i> 비밀번호 변경</h5>
                    <div id="passwordMsg" class="alert d-none"></div>
                    <form id="passwordForm">
                        <!-- 새 비밀번호 확인 [11/23] 추가 -->
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">현재 비밀번호</label>
                            <input type="password" class="form-control" id="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">새 비밀번호</label>
                            <input type="password" class="form-control" id="newPassword" minlength="4" maxlength="20" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                            <input type="password" class="form-control" id="confirmPassword" minlength="4" maxlength="20" required>
                            <div id="passwordMatchMsg" class="form-text"></div>
                        </div>
                        <button type="submit" class="btn btn-warning"><i class="bi bi-check-circle"></i> 비밀번호 변경</button>
                    </form>
                </div></div>
                <!-- [11/16 추가] 회원 탈퇴 카드 -->
                <div class="card shadow-sm border-danger mt-4"><div class="card-body">
                    <h5 class="card-title text-danger mb-2"><i class="bi bi-exclamation-triangle"></i> 회원 탈퇴</h5>
                    <p class="text-muted small mb-3">탈퇴 시 계정 정보와 작성한 맛집·리뷰·찜 데이터가 모두 삭제되며 복구할 수 없습니다.</p>
                    <div id="withdrawMsg" class="alert d-none"></div>
                    <form id="withdrawForm">
                        <!-- 일반 가입 회원에게만 비밀번호 입력창 표시 (소셜 로그인 회원은 숨김) -->
                        <div class="mb-3" th:if="${loginMember.provider == null}">
                            <label for="withdrawPassword" class="form-label">비밀번호 확인</label>
                            <input type="password" class="form-control" id="withdrawPassword" placeholder="현재 비밀번호를 입력하세요" required>
                        </div>
                        <button type="submit" class="btn btn-outline-danger"><i class="bi bi-person-x"></i> 회원 탈퇴</button>
                    </form>
                </div></div>
            </div></div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script>
    // 페이지가 처음 열릴 때 실행
    document.addEventListener('DOMContentLoaded', function () {

        loadStats();

        // 내 맛집 탭이 존재하는 경우에만 조회
        if (document.getElementById('restaurants-tab')) {
            loadMyRestaurants(0);
        } else {
            // 일반 회원은 처음부터 내 리뷰 조회
            loadMyReviews(0);
        }
    });

    // 내 맛집 탭 클릭
    const restaurantsTab = document.getElementById('restaurants-tab');

    if (restaurantsTab) {
        restaurantsTab.addEventListener('shown.bs.tab', function () {
            loadMyRestaurants(0);
        });
    }

    // 내 리뷰 탭 클릭
    document.getElementById('reviews-tab').addEventListener('shown.bs.tab', function () {
        loadMyReviews(0);
    });

    // 찜 목록 탭 클릭
    document.getElementById('wishlists-tab').addEventListener('shown.bs.tab', function () {
        loadMyWishlists();
    });

    function loadStats() {
        fetchJson('/api/mypage/stats').then(function (r) {
            if (!r.ok) return;
            document.getElementById('statRestaurants').textContent = r.body.restaurantCount;
            document.getElementById('statReviews').textContent = r.body.reviewCount;
            document.getElementById('statWishlists').textContent = r.body.wishlistCount;
        });
    }

    function loadMyRestaurants(page) {

        // 일반 회원에게는 내 맛집 기능을 실행하지 않음
        if (!document.getElementById('restaurants-tab')) {
            return;
        }

        fetchJson('/api/mypage/restaurants?page=' + page + '&size=6').then(function (r) {
            const container = document.getElementById('myRestaurantsList');
            const content = (r.body && r.body.content) || [];
            if (content.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted"><i class="bi bi-shop"></i> 등록한 맛집이 없습니다.</p>' +
                    '<a href="/restaurants/new" class="btn btn-primary">맛집 등록하기</a></div>';
                document.querySelector('#restaurantsPagination ul').innerHTML = '';
                return;
            }
            container.innerHTML = content.map(function (x) {
                return '<div class="col-md-4 mb-3"><div class="card shadow-sm h-100"><div class="card-body">' +
                    '<h6 class="card-title"><a href="/restaurants/' + Number(x.id) + '">' + esc(x.name) + '</a></h6>' +
                    '<p class="card-text text-muted small mb-1"><i class="bi bi-tag"></i> ' + esc(x.categoryDisplayName || x.category) + '</p>' +
                    '<p class="card-text text-muted small mb-0"><i class="bi bi-geo-alt"></i> ' + esc(x.address) + '</p>' +
                    '</div><div class="card-footer text-muted small"><i class="bi bi-calendar"></i> ' + esc(formatDateTime(x.createdAt)) + '</div></div></div>';
            }).join('');
            renderPagination('restaurantsPagination', r.body.totalPages, r.body.currentPage, loadMyRestaurants);
        });
    }

    function loadMyReviews(page) {
        fetchJson('/api/mypage/reviews?page=' + page + '&size=10').then(function (r) {
            const container = document.getElementById('myReviewsList');
            const content = (r.body && r.body.content) || [];
            if (content.length === 0) {
                container.innerHTML = '<div class="text-center py-5"><p class="text-muted"><i class="bi bi-chat-dots"></i> 작성한 리뷰가 없습니다.</p></div>';
                document.querySelector('#reviewsPagination ul').innerHTML = '';
                return;
            }
            container.innerHTML = '<div class="list-group">' + content.map(function (x) {
                return '<div class="list-group-item"><div class="d-flex justify-content-between align-items-start"><div>' +
                    '<h6 class="mb-1"><a href="/restaurants/' + Number(x.restaurantId) + '">' + esc(x.restaurantName) + '</a></h6>' +
                    '<div class="mb-1 rating-stars">' + renderStars(x.rating) + '</div>' +
                    '<p class="mb-0 text-muted">' + esc(x.content) + '</p></div>' +
                    '<small class="text-muted">' + esc(formatDateTime(x.createdAt)) + '</small></div></div>';
            }).join('') + '</div>';
            renderPagination('reviewsPagination', r.body.totalPages, r.body.currentPage, loadMyReviews);
        });
    }

    // 찜 목록 조회
    function loadMyWishlists() {
        fetchJson('/api/wishlists').then(function (r) {
            const container = document.getElementById('myWishlistsList');

            if (!r.ok) {
                container.innerHTML =
                    '<div class="col-12 text-center py-5">' +
                    '<p class="text-danger">찜 목록을 불러오지 못했습니다.</p></div>';
                return;
            }

            const content = r.body || [];

            if (content.length === 0) {
                container.innerHTML =
                    '<div class="col-12 text-center py-5">' +
                    '<p class="text-muted">' +
                    '<i class="bi bi-heart"></i> 찜한 맛집이 없습니다.' +
                    '</p></div>';
                return;
            }

            container.innerHTML = content.map(function (x) {
                const restaurant = x.restaurant;

                return '<div class="col-md-4 mb-3">' +
                    '<div class="card shadow-sm h-100">' +
                    '<div class="card-body">' +
                    '<h6 class="card-title">' +
                    '<a href="/restaurants/' + Number(restaurant.id) + '">' +
                    esc(restaurant.name) +
                    '</a></h6>' +
                    '<p class="text-muted small">' +
                    '<i class="bi bi-tag"></i> ' +
                    esc(restaurant.categoryDisplayName) +
                    '</p>' +
                    '<p class="text-muted small">' +
                    '<i class="bi bi-geo-alt"></i> ' +
                    esc(restaurant.address) +
                    '</p>' +
                    '</div>' +
                    '<div class="card-footer bg-white">' +
                    '<button class="btn btn-outline-danger btn-sm" ' +
                    'onclick="removeMyWishlist(' + Number(restaurant.id) + ')">' +
                    '<i class="bi bi-heartbreak"></i> 찜 취소' +
                    '</button>' +
                    '</div></div></div>';
            }).join('');
        });
    }

    // 찜 취소
    function removeMyWishlist(restaurantId) {
        if (!confirm('이 맛집을 찜 목록에서 삭제하시겠습니까?')) {
            return;
        }

        fetchJson('/api/wishlists/' + restaurantId, {
            method: 'DELETE'
        }).then(function (r) {
            if (r.ok) {
                loadMyWishlists();
                loadStats();
            } else {
                alert(r.body.error || '찜 취소에 실패했습니다.');
            }
        });
    }

    function showMsg(id, ok, text) {
        const el = document.getElementById(id);
        el.className = 'alert ' + (ok ? 'alert-success' : 'alert-danger');
        el.textContent = text;
    }

    document.getElementById('nicknameForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const nickname = document.getElementById('newNickname').value.trim();
        fetchJson('/api/mypage/nickname', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nickname: nickname })
        }).then(function (r) {
            showMsg('nicknameMsg', r.ok, r.ok ? r.body.message : (r.body.error || '변경에 실패했습니다.'));
            if (r.ok) document.getElementById('profileNickname').textContent = nickname + '님';
        });
    });

    // 동일 비밀번호 차단 + 확인 일치 검사 [11/23 추가]
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordMatchMsg = document.getElementById('passwordMatchMsg');

    // 새 비밀번호 실시간 일치 여부 안내 [11/23 추가]
    function checkPasswordMatch() {
        const newPw = newPasswordInput.value;
        const confirmPw = confirmPasswordInput.value;

        if (!confirmPw) {
            passwordMatchMsg.textContent = '';
            passwordMatchMsg.className = 'form-text';
            return;
        }
        if (newPw === confirmPw) {
            passwordMatchMsg.textContent = '새 비밀번호가 일치합니다.';
            passwordMatchMsg.className = 'form-text text-success';
        } else {
            passwordMatchMsg.textContent = '새 비밀번호가 일치하지 않습니다.';
            passwordMatchMsg.className = 'form-text text-danger';
        }
    }

    newPasswordInput.addEventListener('input', checkPasswordMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    document.getElementById('passwordForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // 1. 현재 비밀번호와 새 비밀번호가 같은 경우 차단 [11/23 추가]
        if (currentPassword === newPassword) {
            showMsg('passwordMsg', false, '현재 비밀번호와 동일한 비밀번호로는 변경할 수 없습니다.');
            newPasswordInput.focus();
            return;
        }

        // 2. 새 비밀번호와 새 비밀번호 확인이 다른 경우 차단 [11/23 추가]
        if (newPassword !== confirmPassword) {
            showMsg('passwordMsg', false, '새 비밀번호와 새 비밀번호 확인이 일치하지 않습니다.');
            confirmPasswordInput.focus();
            return;
        }

        fetchJson('/api/mypage/password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json'},
            body: JSON.stringify({
                currentPassword: currentPassword,
                newPassword: newPassword
            })
        }).then(function (r) {
            showMsg('passwordMsg', r.ok, r.ok ? r.body.message : (r.body.error || '변경에 실패했습니다.'));
            if (r.ok) {
                document.getElementById('currentPassword').value = '';
                newPasswordInput.value = '';
                confirmPasswordInput.value = '';
                passwordMatchMsg.textContent = '';
            }
        });
    });

    // [11/16 추가] 회원 탈퇴 폼 제출 이벤트
    document.getElementById('withdrawForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!confirm('정말로 탈퇴하시겠습니까? 탈퇴 후에는 계정을 복구할 수 없습니다.')) {
            return;
        }

        const pwInput = document.getElementById('withdrawPassword');
        const password = pwInput ? pwInput.value : '';

        fetchJson('/api/mypage/withdraw', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        }).then(function (r) {
            if (r.ok) {
                alert(r.body.message);
                window.location.href = '/'; // 탈퇴 성공 시 메인(또는 로그인) 화면으로 이동
            } else {
                showMsg('withdrawMsg', false, r.body.error || '회원 탈퇴에 실패했습니다.');
            }
        });
    });

    // 페이지 번호를 10개 단위로 끊어서 보여주고 화살표로 10페이지씩 점프하는 함수
    function renderPagination(navId, totalPages, currentPage, loadFunction) {
        const ul = document.getElementById(navId).querySelector('ul');
        if (totalPages <= 1) {
            ul.innerHTML = '';
            return;
        }

        const maxVisible = 10; //화면에 보여줄 페이지 번호 개수 (10개)
        // 현재 페이지가 속한 블록의 시작 번호와 끝 번호 계산
        const startPage = Math.floor(currentPage / maxVisible) * maxVisible;
        const endPage = Math.min(startPage + maxVisible, totalPages);

        let html = '';

        // 1. 왼쪽 화살표 : 이전 10개 블록의 첫 페이지로 점프! (예: 15페이지에서 누르면 0페이지로)
        const prevPage = Math.max(0, startPage - 1);
        html += '<li class="page-item ' + (startPage === 0 ? 'disabled' : '') + '">' +
                '<a class="page-link" href="#" data-page="' + prevPage + '">&laquo;</a></li>';

        // 2.페이지 번호 (StartPage 부터 endPage 까지만 딱 10개 반복!)
        for (let i = startPage; i < endPage; i++) {
            html += '<li class="page-item ' + (i === currentPage ? 'active' : '') + '">' +
                    '<a class="page-link" href="#" data-page="' + i + '">' + (i + 1) + '</a></li>';
        }

        // 3. 오른쪽 화살표 : 다음 10개 블록의 첫 페이지로 점프! (예: 5페이지에서 누르면 10페이지로)
        const nextPage = endPage;
        html += '<li class="page-item ' + (endPage >= totalPages ? 'disabled' : '') + '">' +
                '<a class="page-link" href="#" data-page="' + nextPage + '">&raquo;</a></li>';

        ul.innerHTML = html;

        // 클릭 이벤트 연결
        ul.querySelectorAll('a.page-link').forEach(function (link) {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const page = parseInt(this.getAttribute('data-page'));
                if (page >= 0 && page < totalPages) {
                    loadFunction(page);
                }
            });
        });
    }
</script>
</body>
</html>
