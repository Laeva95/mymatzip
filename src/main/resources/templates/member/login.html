<!DOCTYPE html>
<!--/*
============================================================
[member/login.html] 로그인 화면 (A 회원·인증 담당)
============================================================
컨트롤러: MemberViewController.loginPage()  (GET /members/login)
  model.addAttribute("oauthProviders", ...) → List<String> 예: ["google"]
  (application-google.properties 프로필이 켜져 있을 때만 "google" 이 들어온다)
로그인 처리: 폼 제출 → fetch POST /api/members/login → MemberApiController.login()
  성공 응답 { id, email, nickname, token } : 세션 로그인 + JWT 토큰 발급이 동시에 이루어진다.
  token 은 Postman 등에서 Authorization: Bearer 토큰 헤더로 /api/** 를 호출할 때 쓴다.
============================================================
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> 로그인</h3>
                    <div id="errorMsg" class="alert alert-danger d-none"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" placeholder="example@test.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" placeholder="비밀번호 입력" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3"><i class="bi bi-box-arrow-in-right"></i> 로그인</button>
                    </form>

                    <!--/* 소셜 로그인 버튼. oauthProviders 목록이 비어 있지 않을 때만 만든다.
                           th:each 로 provider 문자열(예: google)을 하나씩 꺼낸다.
                           th:href="@{/oauth2/authorization/{p}(p=${provider})}" → /oauth2/authorization/google
                           이 주소는 OAuth2AuthorizationRequestRedirectFilter 객체가 받아 구글 로그인 화면으로 보낸다. */-->
                    <div class="d-grid gap-2 mb-3" th:unless="${#lists.isEmpty(oauthProviders)}">
                        <a th:each="provider : ${oauthProviders}"
                           th:href="@{/oauth2/authorization/{p}(p=${provider})}"
                           class="btn btn-outline-dark">
                            <i class="bi bi-google" th:if="${provider == 'google'}"></i>
                            <span th:text="${provider == 'google'} ? 'Google로 로그인' : (${provider} + '로 로그인')">Google로 로그인</span>
                        </a>
                    </div>

                    <div class="text-center">
                        <span class="text-muted">계정이 없으신가요?</span>
                        <a th:href="@{/members/signup}">회원가입</a>
                    </div>
                    <hr>
                    <p class="text-muted small text-center mb-0">테스트 계정: user1@test.com / 1234</p>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const errorMsg = document.getElementById('errorMsg');
        fetchJson('/api/members/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        }).then(function (r) {
            if (r.ok) {
                // 세션 로그인이 끝났으므로 홈으로 이동. (JWT 토큰 r.body.token 은 API 테스트용)
                window.location.href = '/';
            } else {
                errorMsg.textContent = r.body.error || '로그인에 실패했습니다.';
                errorMsg.classList.remove('d-none');
            }
        }).catch(function () {
            errorMsg.textContent = '서버 오류가 발생했습니다.';
            errorMsg.classList.remove('d-none');
        });
    });
</script>
</body>
</html>
