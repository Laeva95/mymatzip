<!DOCTYPE html>
<!--/*
============================================================
[customer/detail.html] 고객 상세 (B 고객 · C 방문·포인트·쿠폰)
============================================================
컨트롤러: CustomerViewController.detail() (GET /customers/{id})
  customer(Customer), balance(포인트 잔액), visitCount, visits(List<Visit> 최근 20),
  points(List<PointHistory> 최근 20), coupons(List<Coupon>)
API: 방문 등록 POST /api/customers/{id}/visits · 쿠폰 발급 POST /api/customers/{id}/coupons
     쿠폰 사용 POST /api/coupons/{id}/use · 고객 삭제 DELETE /api/customers/{id}
============================================================
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${customer.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container mb-5">

    <div class="card mb-4"><div class="card-body d-flex justify-content-between flex-wrap gap-2">
        <div>
            <h2 class="mb-1" th:text="${customer.name}">이름</h2>
            <div class="text-muted" th:text="${customer.maskedPhone}">010-****-0000</div>
            <div class="small mt-1" th:if="${customer.memo}" th:text="'메모: ' + ${customer.memo}">메모</div>
        </div>
        <div class="d-flex gap-3 text-center">
            <div><div class="fs-3 fw-bold text-primary" th:text="${visitCount}">0</div><div class="small text-muted">방문</div></div>
            <!--/* #numbers.formatInteger(값, 최소자리수, 'COMMA') : 1234 → "1,234" */-->
            <div><div class="fs-3 fw-bold text-success" th:text="${#numbers.formatInteger(balance, 1, 'COMMA')} + 'P'">0P</div><div class="small text-muted">포인트</div></div>
        </div>
    </div></div>

    <div class="row g-4">
        <!-- 왼쪽 칼럼: 방문 등록 및 정보 관리 -->
        <div class="col-lg-6">
            <!-- 방문 등록 카드 -->
            <div class="card mb-4">
                <div class="card-header fw-bold"><i class="bi bi-receipt"></i> 방문 등록</div>
                <div class="card-body">
                    <form id="visitForm" class="row g-2">
                        <div class="col-8">
                            <input id="vAmount" type="number" class="form-control" min="0" step="100" required placeholder="결제 금액(원)">
                        </div>
                        <div class="col-4">
                            <button type="submit" class="btn btn-primary w-100">등록</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 고객 관리 위험 구역 -->
            <div class="card border-danger">
                <div class="card-header bg-danger text-white fw-bold">위험 구역</div>
                <div class="card-body">
                    <p class="card-text small text-muted">고객 정보 및 모든 방문/포인트 기록이 영구 삭제됩니다.</p>
                    <button type="button" class="btn btn-danger" th:onclick="deleteCustomer([[${customer.id}]])">고객 계정 삭제</button>
                </div>
            </div>
        </div>

        <!-- 오른쪽 칼럼: 쿠폰 및 이력 관리 (필요 시 추가 구현 영역) -->
        <div class="col-lg-6">
            <!-- 쿠폰 관리 예시 카드 -->
            <div class="card mb-4">
                <div class="card-header fw-bold"><i class="bi bi-ticket-perforated"></i> 쿠폰 발급</div>
                <div class="card-body">
                    <button type="button" class="btn btn-success w-100" th:onclick="issueCoupon([[${customer.id}]])">새 쿠폰 발급</button>
                </div>
            </div>
        </div>
    </div>

</main>

<!--/* API 연동 스크립트 */-->
<script th:inline="javascript">
    // 1. 방문 등록 API 연동
    document.getElementById('visitForm')?.addEventListener('submit', function(e) {
        e.preventDefault();
        const customerId = [[${customer.id}]];
        const amount = document.getElementById('vAmount').value;

        fetch(`/api/customers/${customerId}/visits`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: amount })
        })
            .then(res => {
                if (res.ok) {
                    alert('방문 등록이 완료되었습니다.');
                    location.reload();
                } else {
                    alert('방문 등록에 실패했습니다.');
                }
            });
    });

    // 2. 고객 삭제 API 연동
    function deleteCustomer(customerId) {
        if (!confirm('정말로 이 고객을 삭제하시겠습니까? 모든 데이터가 사라집니다.')) return;

        fetch(`/api/customers/${customerId}`, {
            method: 'DELETE'
        })
            .then(res => {
                if (res.ok) {
                    alert('고객이 삭제되었습니다.');
                    location.href = '/customers'; // 삭제 후 목록 페이지로 이동
                } else {
                    alert('고객 삭제에 실패했습니다.');
                }
            });
    }

    // 3. 쿠폰 발급 API 연동
    function issueCoupon(customerId) {
        fetch(`/api/customers/${customerId}/coupons`, {
            method: 'POST'
        })
            .then(res => {
                if (res.ok) {
                    alert('쿠폰이 발급되었습니다.');
                    location.reload();
                } else {
                    alert('쿠폰 발급에 실패했습니다.');
                }
            });
    }
</script>
</body>
</html>
