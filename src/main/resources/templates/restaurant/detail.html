<!DOCTYPE html>
<!--/*
============================================================
[restaurant/detail.html] 맛집 상세 화면 (B 맛집 · C 리뷰 · D 찜 함께 쓰는 파일)
============================================================
컨트롤러: RestaurantViewController.detail()  (GET /restaurants/{id})
  restaurant    : RestaurantResponse (맛집 정보)
  reviews       : List<ReviewResponse> (최신순)
  averageRating : Double (평균 별점, 리뷰 없으면 0.0)
  isWished      : Boolean (로그인했을 때만. 찜했으면 true)
  loginMember   : GlobalModelAdvice 가 넣는 로그인 회원 (없으면 null)
이 화면에서 부르는 API
  B : DELETE /api/restaurants/{id}                맛집 삭제
  C : POST/DELETE /api/reviews, POST /api/ai/restaurants/{id}/summary (AI 요약), 답글·신고
  D : POST/DELETE /api/wishlists/{restaurantId}  찜하기·찜 취소
============================================================
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/* 맛집 이름을 title 로 넘긴다 */-->
<head th:replace="~{fragments/layout :: head(${restaurant.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container mb-5">

<!-- ── B 맛집: 기본 정보 ── -->
<div class="card mb-4">
    <div class="card-body">
        <!--/* [변경]2026.11.12권성애 사진이 없으면 숨기던 것(th:if) → 카테고리 기본 이미지를 보여 줌
               th:src : 사진 주소가 있으면 그것, 없으면(?:) RestaurantResponse.defaultImageUrl (예: /images/category/korean.svg)
               onerror : 사진 주소가 깨지면(외부 URL 삭제 등) 기본 이미지로 한 번만 바꿈
               data-default : onerror 가 쓸 기본 이미지 주소 (타임리프 3.1은 onerror 안에 변수를 넣는 것을 막아서 data 속성으로 넘김) */-->
        <img th:src="${restaurant.imageUrl} ?: ${restaurant.defaultImageUrl}" th:alt="${restaurant.name}"
             th:attr="data-default=${restaurant.defaultImageUrl}"
             onerror="this.onerror=null;this.src=this.dataset.default;"
             class="img-fluid rounded mb-3" style="max-height:320px;width:100%;object-fit:cover;">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h2 class="mb-1" th:text="${restaurant.name}">맛집 이름</h2>
                <span class="badge bg-primary fs-6" th:text="${restaurant.categoryDisplayName}">한식</span>
            </div>
            <!-- ── D 찜: 찜 버튼 (로그인했을 때만) ── -->
            <!--/* isWished 가 true 면 빨간 채운 버튼, 아니면 테두리 버튼.
                   th:attr="data-wished=..." : 현재 찜 상태를 data 속성으로 넣어 자바스크립트가 읽게 한다. */-->
            <button th:if="${loginMember != null}" id="wishBtn" type="button" class="btn mb-2"
                    th:classappend="${isWished} ? 'btn-danger' : 'btn-outline-danger'"
                    th:attr="data-wished=${isWished}">
                <i class="bi" th:classappend="${isWished} ? 'bi-heart-fill' : 'bi-heart'"></i>
                <span id="wishText" th:text="${isWished} ? '찜 취소' : '찜하기'">찜하기</span>
            </button>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-8">
                <p><i class="bi bi-geo-alt text-primary"></i> <strong>주소:</strong> <span th:text="${restaurant.address}">주소</span></p>
                <p th:if="${restaurant.phone}"><i class="bi bi-telephone text-primary"></i> <strong>전화:</strong> <span th:text="${restaurant.phone}">전화</span></p>
                <p th:if="${restaurant.description}"><i class="bi bi-chat-text text-primary"></i> <strong>설명:</strong> <span th:text="${restaurant.description}">설명</span></p>
                <!--/* [추가]2026.11.12권성애 대표메뉴 · 영업시간 (값이 있을 때만 줄을 보여 줌 — 모범음식점은 영업시간이 없음)
                       white-space:pre-line : 공공 API 영업시간의 줄바꿈을 그대로 보여 줌 (리뷰 내용과 같은 방식) */-->
                <p th:if="${restaurant.representativeMenu}"><i class="bi bi-list-ul text-primary"></i> <strong>대표메뉴:</strong> <span style="white-space:pre-line;" th:text="${restaurant.representativeMenu}">대표메뉴</span></p>
                <p th:if="${restaurant.businessHours}"><i class="bi bi-clock text-primary"></i> <strong>영업시간:</strong> <span style="white-space:pre-line;" th:text="${restaurant.businessHours}">영업시간</span></p>
                <!--/* #temporals.format : LocalDateTime 을 원하는 모양의 글자로 바꾸는 타임리프 유틸리티 */-->
                <p class="text-muted small">
                    등록자: <span th:text="${restaurant.memberNickname}">닉네임</span> |
                    등록일: <span th:text="${#temporals.format(restaurant.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                    <!--/* [추가]2026.11.12권성애 출처 (RestaurantResponse.sourceDisplayName: 직접등록 / 공공API 모범음식점 / 공공API 부산맛집정보서비스) */-->
                    <th:block th:if="${restaurant.sourceDisplayName}"> | 출처: <span th:text="${restaurant.sourceDisplayName}">직접등록</span></th:block>
                </p>
            </div>
            <div class="col-md-4 text-center">
                <div class="bg-light rounded p-3">
                    <div class="fs-1 rating-stars">
                        <i class="bi" th:each="star : ${#numbers.sequence(1,5)}"
                           th:classappend="${star <= averageRating} ? 'bi-star-fill' : 'bi-star'"></i>
                    </div>
                    <div class="fs-3 fw-bold" th:text="${averageRating}">0.0</div>
                    <div class="text-muted">평균 별점</div>
                </div>
            </div>
        </div>
        <!--/* 수정·삭제 버튼: 로그인 회원의 닉네임이 등록자 닉네임과 같거나 관리자일 때만.
               (최종 권한 검사는 서버 RestaurantService 가 다시 한다. 이 조건은 버튼을 보일지 말지만 정한다) */-->
        <div class="mt-3" th:if="${loginMember != null and (loginMember.nickname == restaurant.memberNickname or loginMember.role.name() == 'ADMIN')}">
            <a th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}" class="btn btn-outline-warning btn-sm"><i class="bi bi-pencil"></i> 수정</a>
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteRestaurant(this)"><i class="bi bi-trash"></i> 삭제</button>        </div>
    </div>
</div>

<!-- ── C 리뷰: AI 리뷰 요약 ── -->
<div class="card mb-4 border-primary">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0"><i class="bi bi-robot"></i> AI 리뷰 요약</h5>
            <button th:if="${loginMember != null}" type="button" id="aiSummaryBtn" class="btn btn-primary btn-sm" onclick="requestAiSummary()">
                <i class="bi bi-stars"></i> AI 요약 보기
            </button>
        </div>
        <p class="text-muted small mb-0 mt-2" th:if="${loginMember == null}">로그인하면 리뷰를 AI 로 요약해 볼 수 있습니다.</p>
        <!--/* AI 가 쓴 글은 자바스크립트에서 textContent 로 넣는다 (HTML 로 해석되지 않음) */-->
        <div id="aiSummary" class="ai-box mt-3 d-none"></div>
        <div id="aiSummaryMsg" class="small text-muted mt-2"></div>
    </div>
</div>

<!-- ── C 리뷰: 리뷰 목록·작성 ── -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-chat-dots"></i> 리뷰</h4>
        <!--/* #lists.size : 목록 개수 */-->
        <span class="badge bg-secondary" th:text="${#lists.size(reviews)} + '개'">0개</span>
    </div>
    <div class="card-body">
        <div class="mb-4 p-3 bg-light rounded" th:if="${loginMember != null}">
            <h5>리뷰 작성</h5>
            <div class="mb-2">
                <label class="form-label">별점</label>
                <div id="starSelector">
                    <!--/* th:id="'star-' + ${i}" → id="star-1" ~ "star-5".
                           th:attr="data-rating=${i}" → 클릭한 별의 숫자를 자바스크립트가 읽는다 */-->
                    <i th:each="i : ${#numbers.sequence(1,5)}" th:id="'star-' + ${i}" th:attr="data-rating=${i}"
                       class="bi bi-star text-warning fs-4 star-pick" style="cursor:pointer;"></i>
                </div>
                <input type="hidden" id="rating" value="0">
            </div>
            <div class="mb-2">
                <textarea id="reviewContent" class="form-control" rows="3" maxlength="1000" placeholder="맛집 후기를 남겨주세요!"></textarea>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="submitReview()"><i class="bi bi-send"></i> 리뷰 등록</button>
        </div>

        <div id="reviewList">
            <!--/* th:each="review : ${reviews}" : List<ReviewResponse> 반복. th:id="'review-' + ${review.id}" */-->
            <div class="border-bottom pb-3 mb-3" th:each="review : ${reviews}" th:id="'review-' + ${review.id}">
                <div class="d-flex justify-content-between">
                    <div>
                        <strong th:text="${review.memberNickname}">닉네임</strong>
                        <span class="rating-stars ms-2">
                            <i class="bi small" th:each="star : ${#numbers.sequence(1,5)}"
                               th:classappend="${star <= review.rating} ? 'bi-star-fill' : 'bi-star'"></i>
                        </span>
                    </div>
                    <div>
                        <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</small>
                        <!--/* 본인 리뷰일 때만 삭제 버튼. th:attr 로 리뷰 번호를 data-id 에 넣는다 */-->
                        <button th:if="${loginMember != null and loginMember.id == review.memberId}"
                                type="button" class="btn btn-outline-danger btn-sm ms-2 btn-review-delete"
                                th:attr="data-id=${review.id}"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
                <!--/* 리뷰 내용: th:text 이므로 < > 가 들어 있어도 글자로만 보인다 (XSS 방지) */-->
                <p class="mt-2 mb-1" style="white-space:pre-line;" th:text="${review.content}">리뷰 내용</p>
                <div class="mt-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm btn-reply-toggle" th:attr="data-id=${review.id}">
                        <i class="bi bi-chat-left-text"></i> <span th:id="'replyToggleText-' + ${review.id}">답글 보기</span>
                    </button>
                    <button th:if="${loginMember != null and loginMember.id != review.memberId}"
                            type="button" class="btn btn-outline-warning btn-sm ms-1 btn-report" th:attr="data-id=${review.id}">
                        <i class="bi bi-flag"></i> 신고
                    </button>
                    <div th:id="'repliesArea-' + ${review.id}" style="display:none;" class="mt-2 ms-4">
                        <div th:id="'repliesList-' + ${review.id}"></div>
                        <div class="input-group input-group-sm mt-2" th:if="${loginMember != null}">
                            <input type="text" class="form-control" th:id="'replyContent-' + ${review.id}" placeholder="답글을 입력하세요...">
                            <button type="button" class="btn btn-primary btn-reply-submit" th:attr="data-id=${review.id}"><i class="bi bi-send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <p class="text-muted text-center" th:if="${#lists.isEmpty(reviews)}">아직 리뷰가 없습니다. 첫 리뷰를 남겨보세요!</p>
        </div>
    </div>
</div>

<div class="mt-3">
    <a th:href="@{/restaurants}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 목록으로</a>
</div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>

<!--/* th:inline="javascript" : [[${...}]] 를 자바스크립트 값으로 바꾼다.
       restaurantId  ← RestaurantResponse.getId()
       loginMemberId ← Member.getId() (로그인 안 했으면 null) */-->
<script th:inline="javascript">
const restaurantId = /*[[${restaurant.id}]]*/ 0;
const loginMemberId = /*[[${loginMember != null} ? ${loginMember.id} : null]]*/ null;

/* ── B 맛집: 삭제 ── */
function deleteRestaurant(btn) {   // [변경]2026.11.12권성애 btn: 누른 삭제 버튼 (요청 중 다시 못 누르게)
    if (!confirm('이 맛집을 삭제하시겠습니까? 삭제하면 목록 · 검색에서 보이지 않습니다.')) return;
    btn.disabled = true;           // [추가]2026.11.12권성애 요청이 끝날 때까지 버튼 막기
    fetchJson('/api/restaurants/' + restaurantId, { method: 'DELETE' }).then(function (r) {
        if (r.ok) window.location.href = '/restaurants';
        else {
            alert(r.body.error || '삭제에 실패했습니다.');
            btn.disabled = false;  // [추가]2026.11.12권성애 실패하면 다시 누를 수 있게
        }
    });
}
/* ── C 리뷰: 별점 선택 ── */
document.querySelectorAll('.star-pick').forEach(function (star) {
    star.addEventListener('click', function () {
        const rating = parseInt(this.getAttribute('data-rating'));
        document.getElementById('rating').value = rating;
        for (let i = 1; i <= 5; i++) {
            document.getElementById('star-' + i).className =
                'bi ' + (i <= rating ? 'bi-star-fill' : 'bi-star') + ' text-warning fs-4 star-pick';
        }
    });
});

/* ── C 리뷰: 작성 (POST /api/reviews → ReviewApiController.create) ── */
function submitReview() {
    const rating = parseInt(document.getElementById('rating').value);
    const content = document.getElementById('reviewContent').value.trim();
    if (rating === 0) { alert('별점을 선택해주세요.'); return; }
    if (!content) { alert('리뷰 내용을 입력해주세요.'); return; }
    fetchJson('/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content, rating: rating, restaurantId: restaurantId })
    }).then(function (r) {
        if (r.ok) window.location.reload();
        else alert(r.body.error || '리뷰 등록에 실패했습니다.');
    });
}

/* ── C 리뷰: 삭제 / 신고 / 답글 버튼 연결 ── */
document.querySelectorAll('.btn-review-delete').forEach(function (btn) {
    btn.addEventListener('click', function () {
        if (!confirm('리뷰를 삭제하시겠습니까?')) return;
        fetchJson('/api/reviews/' + this.getAttribute('data-id'), { method: 'DELETE' }).then(function (r) {
            if (r.ok) window.location.reload();
            else alert(r.body.error || '삭제에 실패했습니다.');
        });
    });
});
document.querySelectorAll('.btn-report').forEach(function (btn) {
    btn.addEventListener('click', function () {
        if (!confirm('이 리뷰를 신고하시겠습니까?')) return;
        fetchJson('/api/reviews/' + this.getAttribute('data-id') + '/report', { method: 'POST' })
            .then(function (r) { alert(r.body.message || r.body.error || '처리되었습니다.'); });
    });
});
document.querySelectorAll('.btn-reply-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
        const reviewId = this.getAttribute('data-id');
        const area = document.getElementById('repliesArea-' + reviewId);
        const text = document.getElementById('replyToggleText-' + reviewId);
        if (area.style.display === 'none') {
            area.style.display = 'block';
            text.textContent = '답글 숨기기';
            loadReplies(reviewId);
        } else {
            area.style.display = 'none';
            text.textContent = '답글 보기';
        }
    });
});
document.querySelectorAll('.btn-reply-submit').forEach(function (btn) {
    btn.addEventListener('click', function () { submitReply(this.getAttribute('data-id')); });
});

function loadReplies(reviewId) {
    fetchJson('/api/replies/review/' + reviewId).then(function (r) {
        const container = document.getElementById('repliesList-' + reviewId);
        const list = Array.isArray(r.body) ? r.body : [];
        if (list.length === 0) {
            container.innerHTML = '<p class="text-muted small">아직 답글이 없습니다.</p>';
            return;
        }
        container.innerHTML = list.map(function (reply) {
            let html = '<div class="border-start border-2 ps-2 mb-2 small">' +
                '<div class="d-flex justify-content-between"><strong>' + esc(reply.memberNickname) + '</strong>' +
                '<span class="text-muted">' + esc(formatDateTime(reply.createdAt)) + '</span></div>' +
                '<span>' + esc(reply.content) + '</span>';
            if (loginMemberId !== null && loginMemberId === reply.memberId) {
                html += ' <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="deleteReply(' +
                    Number(reply.id) + ',' + Number(reviewId) + ')"><i class="bi bi-x"></i></button>';
            }
            return html + '</div>';
        }).join('');
    });
}
function submitReply(reviewId) {
    const input = document.getElementById('replyContent-' + reviewId);
    const content = input.value.trim();
    if (!content) { alert('답글 내용을 입력해주세요.'); return; }
    fetchJson('/api/replies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewId: Number(reviewId), content: content })
    }).then(function (r) {
        if (r.ok) { input.value = ''; loadReplies(reviewId); }
        else alert(r.body.error || '답글 등록에 실패했습니다.');
    });
}
function deleteReply(replyId, reviewId) {
    if (!confirm('답글을 삭제하시겠습니까?')) return;
    fetchJson('/api/replies/' + replyId, { method: 'DELETE' }).then(function (r) {
        if (r.ok) loadReplies(reviewId);
        else alert(r.body.error || '삭제에 실패했습니다.');
    });
}

/* ── C 리뷰: AI 요약 (POST /api/ai/restaurants/{id}/summary → AiApiController.summary) ──
   응답 { summary, cached, remaining }. summary 는 textContent 로 넣어 HTML 로 해석되지 않게 한다. */
function requestAiSummary() {
    const btn = document.getElementById('aiSummaryBtn');
    const box = document.getElementById('aiSummary');
    const msg = document.getElementById('aiSummaryMsg');
    btn.disabled = true;
    msg.className = 'small text-muted mt-2';
    msg.textContent = 'AI 가 리뷰를 읽는 중입니다... (무료 모델이라 10초 이상 걸릴 수 있습니다)';
    fetchJson('/api/ai/restaurants/' + restaurantId + '/summary', { method: 'POST' }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) {
            msg.className = 'small text-danger mt-2';
            msg.textContent = r.body.error || 'AI 요약에 실패했습니다.';
            return;
        }
        box.textContent = r.body.summary;
        box.classList.remove('d-none');
        msg.className = 'small text-muted mt-2';
        msg.textContent = (r.body.cached ? '저장된 요약입니다. ' : '') + '오늘 남은 AI 사용 횟수: ' + r.body.remaining + '회';
    }).catch(function () {
        btn.disabled = false;
        msg.className = 'small text-danger mt-2';
        msg.textContent = '서버 오류가 발생했습니다.';
    });
}

/* ── D 찜: 찜하기 / 찜 취소 (POST·DELETE /api/wishlists/{restaurantId} → WishlistApiController) ── */
const wishBtn = document.getElementById('wishBtn');
if (wishBtn) {
    wishBtn.addEventListener('click', function () {
        const wished = wishBtn.getAttribute('data-wished') === 'true';
        fetchJson('/api/wishlists/' + restaurantId, { method: wished ? 'DELETE' : 'POST' }).then(function (r) {
            if (!r.ok) { alert(r.body.error || '처리에 실패했습니다.'); return; }
            const now = !wished;
            wishBtn.setAttribute('data-wished', String(now));
            wishBtn.className = 'btn mb-2 ' + (now ? 'btn-danger' : 'btn-outline-danger');
            wishBtn.querySelector('i').className = 'bi ' + (now ? 'bi-heart-fill' : 'bi-heart');
            document.getElementById('wishText').textContent = now ? '찜 취소' : '찜하기';
        });
    });
}
</script>
</body>
</html>
