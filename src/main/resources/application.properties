# ============================================================
# [application.properties] Spring Boot 애플리케이션 설정 파일
# ============================================================
# 역할: Spring Boot 가 시작할 때 이 파일을 읽어 설정을 적용합니다.
#       서버 포트, 타임리프, DB 연결, JPA, 파일 업로드, JWT, 오류 응답, AI(OpenRouter),
#       사진 저장(S3), 카카오 지도, 메일, 공공데이터 API, 프록시(nginx) 설정이 들어 있습니다.
#
# ★ 이 파일을 바꾼 뒤에는 애플리케이션을 다시 실행해야 적용됩니다.
# ★ 주석은 # 으로 시작합니다. (Java 의 // 와 같은 역할)
# ★ 한글 주석이 ?? 로 깨지지 않도록 IntelliJ 의 properties 파일 인코딩을 UTF-8 로 둡니다.
#   (Settings → Editor → File Encodings → Default encoding for properties files: UTF-8)
#
# ★ 비밀 값(키 · 비밀번호)은 이 파일에 직접 쓰지 않습니다. ${이름:기본값} 으로 바깥에서 읽습니다.
#   내 PC  : 프로젝트 폴더의 developer.properties (깃에 올리지 않음, 아래 spring.config.import 로 읽음)
#   EC2    : /home/ubuntu/matzip/matzip.env (systemd 가 환경 변수로 넣음, 이름은 대문자_밑줄. 예: KAKAO_JS_KEY)
#   ※ developer.properties 는 실행 위치(작업 폴더) 기준이라 jar 안에 들어가지 않습니다.
#
# ★ 이 파일에 없지만 코드가 직접 읽는 값
#   OWNER_VALIDATE : 국세청 사업자 진위확인 API 키 (NtsBusinessApiClient). 없으면 사장 권한 "실제" 신청이 503,
#                    테스트 신청(시연용)은 키 없이 동작
#   Google 로그인   : application-google.properties (SPRING_PROFILES_ACTIVE=google 일 때만)
# ============================================================
spring.config.import=optional:file:./developer.properties

# ── 서버 포트 ──────────────────────────────────────────────
# 이 프로젝트는 8082 포트를 사용합니다.
# 브라우저에서 http://localhost:8082 로 접속합니다.
# (다른 프로젝트가 8080 을 쓰고 있어도 겹치지 않도록 8082 로 정했습니다)
server.port=8082

# ── 타임리프 화면 (Thymeleaf) ──────────────────────────────
# Controller 가 return "member/login" 을 돌려주면
# ThymeleafViewResolver 객체가 앞(prefix)과 뒤(suffix)를 붙여 화면 파일을 찾습니다.
#   classpath:/templates/ + member/login + .html
#   → src/main/resources/templates/member/login.html
# prefix·suffix 는 위 값이 기본값이라 적지 않아도 됩니다.
# cache=false : 개발 중 html 을 고치면 서버 재시작 없이 새로고침만으로 반영
spring.thymeleaf.cache=false

# ── MySQL 8 데이터베이스 연결 ──────────────────────────────
# 내 PC  : 기본값(localhost:3306 / matzip / matzip1234)으로 로컬 MySQL 에 연결.
#          팀 공용 RDS 를 쓰려면 developer.properties 에 DB_HOST · DB_USERNAME · DB_PASSWORD 를 넣는다
# 배포   : matzip.env 의 DB_HOST(RDS 주소 또는 EC2 안의 MySQL), DB_NAME, DB_USERNAME, DB_PASSWORD
# ${이름:기본값} : 환경 변수가 있으면 그 값, 없으면 : 뒤의 기본값을 쓴다
# (테스트는 application-test.properties 의 H2 메모리 DB 를 씀)
# serverTimezone=Asia/Seoul        : DB 시간과 자바 LocalDateTime 을 한국 시간으로 맞춤
# allowPublicKeyRetrieval=true     : MySQL 8 의 기본 인증 방식(caching_sha2_password)을 SSL 없이 쓸 때 필요
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:matzip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:matzip}
spring.datasource.password=${DB_PASSWORD:matzip1234}

# ── JPA / Hibernate ────────────────────────────────────────
# JPA       : Java 객체(Entity)와 DB 테이블을 연결하는 표준
# Hibernate : JPA 를 실제로 구현한 라이브러리
#
# ddl-auto : 서버를 켤 때 엔티티를 보고 테이블을 어떻게 맞출지. 환경 변수 DDL_AUTO 로 바꾼다.
#   create (기본) : 켤 때마다 기존 테이블을 지우고 새로 만듦 → 모든 데이터 삭제 (내 PC 개발 · 발표 연습용)
#   update        : 데이터를 유지하고 새 테이블 · 새 컬럼만 추가 (배포 서버는 이것)
#                   컬럼 이름 변경 · 삭제 · 제약 변경은 하지 않으므로 그런 변경은 SQL 로 직접 ALTER 한다
#                   (예: wishlist 의 UNIQUE(member_id, restaurant_id) 는 배포 DB 에 직접 추가함)
# ★ 배포 서버는 반드시 DDL_AUTO=update + SQL_INIT_MODE=never.
#   기본값(create · always) 그대로 배포하면 CD 배포 · 재시작마다 회원 · 리뷰 · 찜 데이터가 모두 지워진다.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}

# 실행되는 SQL 을 콘솔(Run 창)에 출력
spring.jpa.show-sql=true

# 출력되는 SQL 을 줄바꿈해서 보기 좋게 표시
spring.jpa.properties.hibernate.format_sql=true

# DB 종류(Dialect)는 Hibernate 가 MySQL 연결 정보를 보고 MySQLDialect 를 자동으로 고른다
#
# open-in-view 는 따로 설정하지 않아 기본값(켜짐)이다. 서버 시작 시 나오는 경고가 이것.
#   켜져 있으면 웹 요청 하나가 끝날 때까지 DB 커넥션을 잡고 있어서, 요청 안에서 외부 API(국세청 · AI)를
#   기다리는 동안에도 커넥션이 반납되지 않는다 (커넥션 풀 5개, 아래 hikari 설정).
#   끄려면 spring.jpa.open-in-view=false — 화면에서 LAZY 값을 읽는 곳이 없는지 전체 점검 후에 적용할 것

# JPA 가 테이블을 만든 뒤에 data.sql 을 실행하도록 순서 지정
spring.jpa.defer-datasource-initialization=true

# ── data.sql (예제 데이터) ─────────────────────────────────
# always (기본) : 켤 때마다 data.sql 의 INSERT 문을 실행 (예제 맛집 · 리뷰 · 테스트 계정)
# never         : 실행하지 않음 (배포 서버)
# ★ data.sql 에는 비밀번호 1234 인 테스트 계정(관리자 admin@test.com 포함)이 들어 있다.
#   DataInitializer 가 켤 때 암호화해서 실제로 로그인된다. 공개 배포 서버에서는 never 로 두고,
#   이미 들어간 테스트 계정은 비밀번호를 바꾸거나 삭제할 것.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

# ── 파일 업로드 크기 제한 ───────────────────────────────────
# 맛집 대표 사진 · 리뷰 사진 업로드(POST /api/files/uploadfors3only) 최대 크기.
# 기본값 1MB 는 휴대폰 사진에 작아서 5MB 로 늘립니다.
# ★ 배포 서버는 앞단 nginx 도 기본 1MB 제한(client_max_body_size)이 있어서 nginx 설정도 5M 이상이어야 한다
#   (아니면 nginx 가 413 오류로 먼저 거부함)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── JWT (로그인 토큰) ──────────────────────────────────────
# [수정] 비밀키를 저장소에 직접 적지 않고 환경 변수 JWT_SECRET 에서 읽습니다.
#   - 환경 변수가 없으면 빈 값이 되고, JwtTokenProvider 가 실행할 때마다
#     임의의 비밀키를 새로 만듭니다(개발용. 서버를 다시 켜면 예전 토큰은 무효).
#   - 실제 서비스: JWT_SECRET 에 32자 이상 임의 문자열을 넣고 실행합니다.
#     예) JWT_SECRET=아주-긴-임의-문자열 ./gradlew bootRun
jwt.secret=${JWT_SECRET:}
# 토큰 유효 시간 (밀리초) : 86400000 = 24시간
jwt.expiration=86400000

# ── 오류 응답에 담을 정보 ──────────────────────────────────
# include-message   : 오류 메시지 (화면의 fetch 가 err.error / message 로 보여 줌)
# include-stacktrace: [수정] never — 스택 트레이스(서버 내부 코드 위치)를 브라우저로 보내지 않습니다.
#                     디버깅할 때는 Run 창의 로그에서 확인합니다.
# include-exception : [수정] false — 예외 클래스 이름도 보내지 않습니다.
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================================
# [팀 프로젝트] Spring AI → OpenRouter (무료 모델만 사용)
# ============================================================
# OpenRouter 는 OpenAI 와 같은 요청 형식을 쓰므로 OpenAI 설정에 주소만 바꿔 넣습니다.
# OpenAiChatModel 객체가 base-url + /v1/chat/completions 로 요청을 보냅니다.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# 키가 없어도 서버(와 GitHub Actions 테스트)는 켜지도록 기본값 no-key.
# 실제 AI 호출은 환경 변수 OPENROUTER_API_KEY 가 있어야 성공합니다.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:no-key}
# 반드시 :free 로 끝나는 무료 모델. 아니면 FreeModelGuard 클래스가 서버 시작을 막습니다 (유료 요금 방지).
# 무료 모델 목록은 자주 바뀌므로 404 등 오류가 나면 환경 변수 OPENROUTER_MODEL 만 바꿉니다.
spring.ai.openai.chat.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
spring.ai.openai.chat.temperature=0.3
# 회원 1명이 하루에 쓸 수 있는 AI 추천 · AI 리뷰 요약 호출 횟수 (둘을 합쳐서 셈, AiUsageLimiter)
# ※ OpenRouter 무료 모델 한도는 "계정 전체" 하루 50회 (크레딧 $10 이상 구매 시 1,000회), 실패한 요청도 셈.
#   AI 추천 · 요약 · 리뷰 스팸 검사가 이 한도를 함께 쓴다.
app.ai.daily-limit-per-member=5
# 리뷰 AI 스팸 검사 사용 여부 (AiReviewSpamDetectionService). false 면 규칙 · AI 검사를 모두 하지 않음
app.ai.review-spam-check-enabled=${AI_REVIEW_SPAM_CHECK_ENABLED:true}
# 의심 리뷰 일괄 AI 검사 (ReviewModerationBatchService / ReviewModerationScheduler)
#   리뷰 등록 때는 AI 를 부르지 않고, 의심 리뷰(PENDING)를 모아 AI 한 번 호출로 검사한다.
#   아래 값은 코드의 기본값이라 이 파일에 적지 않아도 동작한다. 바꾸고 싶을 때만 주석을 풀어 쓴다.
#   유료 AI 로 바꾸면 min-interval-minutes · max-wait-hours 를 줄여 5~10분 간격 검사로 바꿀 수 있다.
#   ※ properties 파일은 줄 끝 주석이 안 되므로(값에 포함됨) 설명은 윗줄에 둔다.
# 실행 조건을 확인하는 간격 (1분. DB 조회만 하고 조건이 맞을 때만 AI 를 부름)
# app.ai.review-moderation.check-interval-ms=60000
# 대기 리뷰가 이만큼 쌓이면 검사
# app.ai.review-moderation.trigger-count=10
# 가장 오래된 대기 리뷰가 이 시간을 넘으면 개수와 상관없이 검사
# app.ai.review-moderation.max-wait-hours=6
# AI 한 번에 보낼 최대 리뷰 수
# app.ai.review-moderation.max-per-call=20
# AI 호출 사이 최소 간격 (무료 한도 보호)
# app.ai.review-moderation.min-interval-minutes=60
# 검사 중(PROCESSING)으로 멈춘 리뷰를 다시 대기로 돌리는 시간 (서버 재시작 대비)
# app.ai.review-moderation.claim-timeout-minutes=30
# Spring AI 가 임베딩·이미지 등 다른 OpenAI 기능의 자동 설정을 만들지 않도록 채팅만 켭니다.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ============================================================
# [팀 프로젝트] 사진 저장 위치: local(내 PC uploads 폴더) / s3(AWS S3)
# ============================================================
# 맛집 · 리뷰 사진 업로드(POST /api/files/uploadfors3only)는 s3 일 때만 동작한다.
#   local 이면 "사진 저장소(S3) 설정이 없습니다"(503). 내 PC 에서 사진을 테스트하려면 APP_STORAGE=s3 + AWS 자격 증명이 필요
# AWS 키는 코드 · 이 파일에 없다. 내 PC 는 ~/.aws/credentials, EC2 는 연결된 IAM 역할을 SDK 가 자동으로 사용
# S3 버킷은 비공개. 사진은 GET /api/files/{folder}/{파일이름} 으로 서버가 S3 에서 읽어 응답한다
app.storage=${APP_STORAGE:local}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}

# 카카오 지도 · 주소 검색용 JavaScript 키 — 값이 없으면 빈 값이라 오류 없이 실행 (지도만 안 보임)
kakao.map.js-key=${KAKAO_JS_KEY:}

# 맛집 목록 페이지: 한 페이지 맛집 수 · 아래 페이지 번호 버튼 수 (코드 기본값보다 이 값이 우선)
app.restaurant.page-size=12
app.restaurant.page-block=10

# 커넥션 풀 (HikariCP) — 공용 RDS 연결 수를 아끼기 위해 기본 10개 → 5개
#   팀원 PC 여러 대 + EC2 가 같은 RDS 를 쓰므로 (서버 6대 × 5 = 최대 약 30개)
#   외부 API 를 기다리는 요청이 5개 겹치면 다른 요청이 커넥션을 기다린다 (위 open-in-view 설명 참고)
spring.datasource.hikari.maximum-pool-size=5
# 쉴 때 유지할 최소 커넥션 (기본값은 max 와 같음). 로컬 개발은 2개면 충분
spring.datasource.hikari.minimum-idle=2

# Gmail SMTP 이메일 발송 설정 (회원가입 · 로그인 이메일 인증번호)
#   MAIL_USERNAME / MAIL_PASSWORD(Gmail 앱 비밀번호)가 없으면 인증 메일을 보낼 수 없다
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── 공공데이터 API 키 (부산 맛집 · 모범음식점) ──────────────
# EC2 는 matzip.env 의 PUBLICDATA_SERVICEKEY, 내 PC 는 developer.properties 의 publicdata.servicekey
publicdata.servicekey=${PUBLICDATA_SERVICEKEY:}

# ── nginx 뒤에서 실제 접속 주소 사용 (삭제 금지) ─────────────
# nginx 가 보내는 X-Forwarded-Proto · X-Forwarded-Host 를 보고 https://도메인 을 실제 주소로 인식
# 이 줄이 없으면 Google 로그인 redirect_uri 가 http://localhost:5000/... 로 만들어져
# Google 이 redirect_uri_mismatch 로 로그인을 거부함 (배포 서버에서만 생기는 문제)
server.forward-headers-strategy=framework